name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality:
    name: quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Template app alone: lint + typecheck + generator tests + build.
      - name: Check template
        run: npm run check

      # Runs in the runner's default shell (PowerShell on Windows), as a user would.
      - name: Create an example site
        run: npm run new-site -- https://www.example.com

      - name: Check template with a site folder present
        run: npm run check

      - name: Check the site on its own
        working-directory: sites/example-com
        run: npm run check

      - name: Site build stays inside its folder
        working-directory: sites/example-com
        run: node -e "require('fs').accessSync(require('path').join('.next', 'standalone', 'server.js'))"

      - name: Generator flags work when called directly
        run: node scripts/new-site.mjs https://www.example.com --name example-flags --no-install
